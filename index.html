<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WelthWest AI — automated trading dashboard" />
    <title>WelthWest AI</title>
    <script>
      // Set the theme before first paint so a light-theme user never sees a
      // dark flash while React boots. Kept in sync with src/lib/theme.tsx.
      (function () {
        try {
          var t = localStorage.getItem("welthwest-theme");
          document.documentElement.dataset.theme =
            t === "light" || t === "dark" ? t : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
